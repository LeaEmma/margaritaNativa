# Despliegue de margaritanativa.com.ar
#
# El sitio es estático: Netlify corre el build y sirve ./dist desde su CDN.
# No hace falta adaptador de Astro ni funciones.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 y sus dependencias piden Node 22.19 o superior.
  NODE_VERSION = "22"

# El subdominio de Netlify sigue respondiendo; lo mandamos al dominio propio
# para que los buscadores no vean dos copias del mismo sitio.
[[redirects]]
  from = "https://subtle-starlight-98e33c.netlify.app/*"
  to = "https://margaritanativa.com.ar/:splat"
  status = 301
  force = true

# Los archivos de /_astro/ llevan un hash del contenido en el nombre: si cambian,
# cambia la URL. Por eso se pueden cachear para siempre sin riesgo de servir
# algo viejo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML, en cambio, se revalida siempre: es lo que cambia cuando se actualiza
# un precio.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
