<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Margarita Nativa">
  <circle cx="50" cy="50" r="47" fill="#fffbee" stroke="#550000" stroke-width="2.5" />
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#550000" stroke-width="0.9" />

  <g fill="#550000">
    <!-- Pétalos mayores (cruz) -->
    <g>
      <path d="M50 13 C62 27 62 41 50 49 C38 41 38 27 50 13 Z" />
      <path d="M50 13 C62 27 62 41 50 49 C38 41 38 27 50 13 Z" transform="rotate(90 50 50)" />
      <path d="M50 13 C62 27 62 41 50 49 C38 41 38 27 50 13 Z" transform="rotate(180 50 50)" />
      <path d="M50 13 C62 27 62 41 50 49 C38 41 38 27 50 13 Z" transform="rotate(270 50 50)" />
    </g>
    <!-- Pétalos menores (diagonales) -->
    <g transform="rotate(45 50 50)">
      <path d="M50 24 C58 32 58 42 50 48 C42 42 42 32 50 24 Z" />
      <path d="M50 24 C58 32 58 42 50 48 C42 42 42 32 50 24 Z" transform="rotate(90 50 50)" />
      <path d="M50 24 C58 32 58 42 50 48 C42 42 42 32 50 24 Z" transform="rotate(180 50 50)" />
      <path d="M50 24 C58 32 58 42 50 48 C42 42 42 32 50 24 Z" transform="rotate(270 50 50)" />
    </g>
  </g>

  <!-- Corola -->
  <g fill="#fffbee">
    <ellipse cx="50" cy="36" rx="2.6" ry="8" />
    <ellipse cx="50" cy="36" rx="2.6" ry="8" transform="rotate(90 50 50)" />
    <ellipse cx="50" cy="36" rx="2.6" ry="8" transform="rotate(180 50 50)" />
    <ellipse cx="50" cy="36" rx="2.6" ry="8" transform="rotate(270 50 50)" />
    <circle cx="50" cy="50" r="6.5" />
  </g>
  <circle cx="50" cy="50" r="3.4" fill="#550000" />
</svg>
